name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck RIFTT_part1.sh RIFTT_part2.sh
      - name: Repository sanity
        run: |
          grep -q '^Bootstrap:' RIFTT.def
          test -s vendor/blat/blat
          test -s example/expected_resultTable.tsv
          test -s config/params.conf.example

  build-and-test:
    # Slow: builds the container from scratch. Manual / weekly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Install Apptainer and debootstrap
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer debootstrap

      - name: Build the container
        run: sudo apptainer build RIFTT.sif RIFTT.def

      - name: Download the GENCODE v38 annotation
        run: |
          wget -q https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_38/gencode.v38.primary_assembly.annotation.gtf.gz
          gunzip gencode.v38.primary_assembly.annotation.gtf.gz

      - name: Run Part 2 on the bundled example
        run: |
          cp config/params.conf.example config/params.conf
          sed -i "s|^ANNO=.*|ANNO=$PWD/gencode.v38.primary_assembly.annotation.gtf|"  config/params.conf
          sed -i "s|^OUTPUTFOLDER=.*|OUTPUTFOLDER=$PWD/example/part2_intermediates|"    config/params.conf
          sed -i "s|^CLINTABLE=.*|CLINTABLE=$PWD/example/clintable.xlsx|"                config/params.conf
          RIFTT_SIF="$PWD/RIFTT.sif" ./RIFTT_part2.sh

      - name: Compare with the reference
        run: |
          pip install pandas openpyxl numpy
          python3 - <<'EOF'
          import glob, sys, numpy as np, pandas as pd

          rt = sorted(glob.glob("example/part2_intermediates/filter_results/run_*/resultTable.xlsx"))[-1]
          got = pd.read_excel(rt)
          ref = pd.read_csv("example/expected_resultTable.tsv", sep="\t")

          key = ["sample", "caller", "gene1", "gene2", "break5prime", "break3prime"]
          g = got[got.ev_level >= 6].sort_values(key).reset_index(drop=True)
          r = ref.sort_values(key).reset_index(drop=True)

          if g.shape[0] != r.shape[0]:
              sys.exit(f"high-evidence call count {g.shape[0]} != expected {r.shape[0]}")

          # Categorical / integer columns must match exactly.
          exact = ["cohort", "sample", "caller", "gene1", "gene2", "label", "reciprocal",
                   "break5prime", "break3prime", "cov", "mitelman_rec", "ev_level", "known",
                   "passCallFilt", "passBL", "passPS", "passFTS", "passRS", "callerOverlap"]
          for c in exact:
              if not (g[c].astype(str).values == r[c].astype(str).values).all():
                  sys.exit(f"column {c} differs from the reference")

          # Scores are ratios and independent of the annotation's library scaling.
          for c in ["PS", "FTS5", "FTS3", "FTS", "RS"]:
              if not np.allclose(g[c].astype(float), r[c].astype(float), rtol=1e-6, equal_nan=True):
                  sys.exit(f"column {c} differs from the reference")

          print("OK - high-evidence calls, scores and evidence levels match the reference")
          EOF
